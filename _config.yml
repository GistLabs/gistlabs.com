title: Gist Labs
email: john@gistlabs.com
description: >-
  We Get To The Source Of People, Process, And Technology.
  World-class, deep consulting into the most important aspects of your Strategy, Delivery, and Technology.

# Theme
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: default

# Site author
author:
  name: John Heintz
  email: john@gistlabs.com
  twitter: jheintz
  github: jheintz
  bio: "Principal at Gist Labs"

# Analytics
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-XXXXXXXXXX"
    anonymize_ip: false

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-include-cache

# Pagination
paginate: 10
paginate_path: /blog/page:num/

# Page defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single

# Exclude from processing
exclude:
  - convert_posts.py
  - gistlabs-blog.html
  - .wordpress/
  - vendor/
  - Gemfile.lock
